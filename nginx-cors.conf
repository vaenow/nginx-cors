upstream servlist {
        server nginx-cors-worker.proxy:8080;
}
upstream servlist-24hr {
        server nginx-cors-worker-24hr.proxy:8080;
}

upstream servlist-getSmartPred {
        server nginx-cors-worker-getSmartPred.proxy:8080;
}

upstream servlist-getRecognizePattern {
        server nginx-cors-worker-getRecognizePattern.proxy:8080;
}

map $uri  $upstreamserver {
    default                     servlist;
    ~24hr$                      servlist-24hr;
    ~getSmartPred$              servlist-getSmartPred;
    ~getRecognizePattern$       servlist-getRecognizePattern;
}

server {
  listen 8080;
  server_name nginx-cors-server;
  resolver 8.8.8.8;

  location / {
    root  /app/dist/;
    index index.html;
  }

  location ~* ^/(.*):/(.*?)/(.*)$ {
    if ($request_method = 'OPTIONS') {
      add_header 'Content-Length' 0;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Exchange-User-Id';
      return 204;
    }
    # rewrite ^/(.*) /$1 break;
    # rewrite .* / break;
    # cors-dispatcher
    proxy_pass http://$upstreamserver/$uri?$args;
    proxy_redirect ~*$uri?$args /;
    # cors-client
    #proxy_pass $1://$2/$3?$args;
    #proxy_redirect ~*$1://$2(.*) /;

    # proxy_set_header Host $host;
    # proxy_set_header X-Real-IP $remote_addr;
    # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # proxy_set_header X-Forwarded-Host $server_name;
    #add_header 'Access-Control-Allow-Origin' "$http_origin";

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;

    add_header 'Access-Control-Allow-Origin' "*" always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD, PUT' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Exchange-User-Id' always;
    add_header X-debug-message "Proxy dis $host URI $uri via $1 :// $2 / $3 from $remote_addr  $args origin:$http_origin up:$upstreamserver" always;
    
    # cache
    # proxy_ignore_headers Expires Cache-Control Set-Cookie Vary;
    proxy_ignore_headers Expires Cache-Control;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache "cache_cors";
    proxy_cache_key $3:$args;
    proxy_cache_min_uses 1;
    proxy_cache_valid 200 301 302 __NGINX_PROXY_CACHE_VALID_TIME__;
    # proxy_cache_valid any __NGINX_PROXY_CACHE_VALID_TIME__;
    proxy_cache_revalidate off;
    proxy_cache_lock on;
    proxy_cache_methods GET;
    proxy_cache_use_stale timeout updating  error;
    proxy_cache_bypass $cookie_nocache $arg_nocache;
    proxy_no_cache $cookie_nocache $arg_nocache$arg_comment;
    proxy_no_cache $http_pragma    $http_authorization;
    
    proxy_hide_header nginx-cache;
    add_header nginx-cache "$upstream_cache_status";
  }

  # error_page 404 /404.html;
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}

